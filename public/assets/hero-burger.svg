<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1000" viewBox="0 0 1280 1000" fill="none" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">A Big Mac kind of thank you</title>
  <desc id="hero-desc">An illustrated double-decker burger with golden fries and a red soda cup, drawn in a warm vintage diner palette on a transparent background.</desc>
