<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f1e7" />
    <meta name="robots" content="noindex" />
    <title>翻滚徽章预览 · Buy me a Big Mac</title>
    <link rel="stylesheet" href="/assets/badge-preview.css" />
  </head>
  <body>
    <main>
      <header class="page-heading">
        <a class="brand" href="/">Buy me a Big Mac</a>
        <h1>让心意，翻个面。</h1>
        <p>汉堡、文字和按钮一起翻滚，五种语言循环切换。下面每一枚都是直接引用同一个 SVG。</p>
        <a class="download" href="/assets/badge-carousel.svg" download="badge-carousel.svg">下载 SVG</a>
      </header>

      <section class="examples" aria-labelledby="original-title">
        <div class="section-heading">
          <h2 id="original-title">原尺寸</h2>
          <p>虚线标记图片边界，方便查看透明留白。</p>
        </div>
        <div class="original-grid">
          <figure class="sample sample-light">
            <figcaption>浅色背景</figcaption>
            <div class="stage">
              <span class="badge-boundary">
                <img class="badge" src="/assets/badge-carousel.svg" width="233" height="53" alt="五种语言循环翻面的巨无霸赞助徽章" />
              </span>
            </div>
          </figure>
          <figure class="sample sample-dark">
            <figcaption>深色背景</figcaption>
            <div class="stage">
              <span class="badge-boundary">
                <img class="badge" src="/assets/badge-carousel.svg" width="233" height="53" alt="深色背景下的巨无霸赞助徽章翻面动画" />
              </span>
            </div>
          </figure>
        </div>
      </section>

      <section class="examples" aria-labelledby="enlarged-title">
        <div class="section-heading">
          <h2 id="enlarged-title">放大 3 倍</h2>
          <p>看看图形和文字的细节；窄屏自动缩放。</p>
        </div>
        <div class="enlarged-grid">
          <figure class="sample sample-light">
            <figcaption>浅色背景</figcaption>
            <div class="stage stage-large">
              <span class="badge-boundary badge-boundary-large">
                <img class="badge badge-large" src="/assets/badge-carousel.svg" width="699" height="159" alt="放大三倍的巨无霸赞助徽章翻面动画" />
              </span>
            </div>
          </figure>
          <figure class="sample sample-dark">
            <figcaption>深色背景</figcaption>
            <div class="stage stage-large">
              <span class="badge-boundary badge-boundary-large">
                <img class="badge badge-large" src="/assets/badge-carousel.svg" width="699" height="159" alt="深色背景下放大三倍的巨无霸赞助徽章翻面动画" />
              </span>
            </div>
          </figure>
        </div>
      </section>

      <footer>一个文件，完整动画。图形、文字和翻滚效果均包含在 SVG 内。</footer>
    </main>
  </body>
</html>
